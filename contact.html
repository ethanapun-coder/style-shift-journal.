<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <title>Contact Us</title>
       <style> * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; } body { background-color: rgb(255, 161, 183); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; } .contact-container { background: white; width: 100%; max-width: 500px; padding: 35px; border-radius: 12px; box-shadow: 0 8px 20px rgba(0,0,0,0.1); } .contact-container h1 { text-align: center; margin-bottom: 10px; color: #333; } .contact-container p { text-align: center; margin-bottom: 25px; color: #666; } .form-group { margin-bottom: 18px; } label { display: block; margin-bottom: 6px; color: #444; font-weight: bold; } input, textarea { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 8px; font-size: 15px; transition: border-color 0.3s; } input:focus, textarea:focus { outline: none; border-color: #4a90e2; } textarea { resize: vertical; min-height: 120px; } button { width: 100%; padding: 14px; background: #4a90e2; color: white; border: none; border-radius: 8px; font-size: 16px; cursor: pointer; transition: background 0.3s; } button:hover { background: #357bd8; } .contact-info { margin-top: 25px; text-align: center; color: #555; font-size: 14px; } .contact-info p { margin: 6px 0; } </style>
      
       </head>
       
       
       <body>
       
         <div class="contact-container">
         
             <h1>Contact Us</h1>
                 <p>We’d love to hear from you!</p>
                 
                     <form>
                           <div class="form-group">
                                   <label for="name">Full Name</label>
                                           <input 
                                                     type="text" 
                                                               id="name" 
                                                                         name="name" 
                                                                                   placeholder="Enter your name" 
                                                                                             required
                                                                                                     />
                                                                                                           </div>
                                                                                                           
                                                                                                                 <div class="form-group">
                                                                                                                         <label for="email">Email Address</label>
                                                                                                                                 <input 
                                                                                                                                           type="email" 
                                                                                                                                                     id="email" 
                                                                                                                                                               name="email" 
                                                                                                                                                                         placeholder="Enter your email" 
                                                                                                                                                                                   required
                                                                                                                                                                                           />
                                                                                                                                                                                                 </div>
                                                                                                                                                                                                 
                                                                                                                                                                                                       <div class="form-group">
                                                                                                                                                                                                               <label for="subject">Subject</label>
                                                                                                                                                                                                                       <input 
                                                                                                                                                                                                                                 type="text" 
                                                                                                                                                                                                                                           id="subject" 
                                                                                                                                                                                                                                                     name="subject" 
                                                                                                                                                                                                                                                               placeholder="Enter subject"
                                                                                                                                                                                                                                                                       />
                                                                                                                                                                                                                                                                             </div>
                                                                                                                                                                                                                                                                             
                                                                                                                                                                                                                                                                                   <div class="form-group">
                                                                                                                                                                                                                                                                                           <label for="message">Message</label>
                                                                                                                                                                                                                                                                                                   <textarea 
                                                                                                                                                                                                                                                                                                             id="message" 
                                                                                                                                                                                                                                                                                                                       name="message" 
                                                                                                                                                                                                                                                                                                                                 placeholder="Write your message..." 
                                                                                                                                                                                                                                                                                                                                           required
                                                                                                                                                                                                                                                                                                                                                   ></textarea>
                                                                                                                                                                                                                                                                                                                                                         </div>

                                                                                                                                                                                                                                                                                                                                                        <section>
  <iframe
    src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3022.240843046303!2d-73.98847952472059!3d40.75672727138687!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x89c259c9335eb1d9%3A0x3592e812fb21531!2sTamashii%20Nations%20Store%20New%20York!5e0!3m2!1sen!2sus!4v1779197070851!5m2!1sen!2sus"
    width="430"
    height="270"
    style="border:0;"
    allowfullscreen
    loading="lazy"
    referrerpolicy="no-referrer-when-downgrade">
  </iframe>
</section>
                                                                                                                                                                                                                                                                                                                                                         
                                                                                                                                                                                                                                                                                                                                                               <button type="submit">Send Message</button>
                                                                                                                                                                                                                                                                                                                                                                   </form>
                                                                                                                                                                                                                                                                                                                                                                   
                                                                                                                                                                                                                                                                                                                                                                       <div class="contact-info">
                                                                                                                                                                                                                                                                                                                                                                             <p>Email: ethandagoat@example.com</p>
                                                                                                                                                                                                                                                                                                                                                                                   <p>Phone: +1 (677) 67-6767</p>
                                                                                                                                                                                                                                                                                                                                                                                         <p>Address: 123 Main Street, New York, NY</p>
                                                                                                                                                                                                                                                                                                                                                                                             </div>
                                                                                                                                                                                                                                                                                                                                                                                             
                                                                                                                                                                                                                                                                                                                                                                                             
                                                                                                                                                                                                                                                                                                                                                                                        
                                                                                                                                                                                                                                                                                                                                                                                               
                                                                                                                                                                                                                                                                                                                                                                                               </body>
                                                                                                                                                                                                                                                                                                                                                                                               </html>>
